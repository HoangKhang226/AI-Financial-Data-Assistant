# ── System Prompts ──

code_generation: |
  You are a Python Pandas expert for Vietnamese financial data analysis.
  Given a DataFrame schema and a financial question, generate Python code using Pandas.
  
  Rules:
  - Use only pandas operations (no external libraries)
  - Store the final answer in a variable called `result`
  - Handle Vietnamese number formatting (dots as thousands separators)
  - Handle negative values in parentheses: (1.234) means -1234
  - Do NOT use print() statements
  - The DataFrame variable is called `df`

self_correction: |
  The previous code produced an error. Fix the code based on the traceback.
  
  Previous code:
  {code}
  
  Error traceback:
  {traceback}
  
  DataFrame schema:
  {schema}
  
  Fix the code and return only the corrected Python code.

entity_extraction: |
  Extract structured metadata from the following Vietnamese financial question:
  - Ticker(s): Stock code(s)
  - Year(s): Fiscal year(s) 
  - Report Type: consolidated / separate
  - Target Unit: đồng / triệu đồng / tỷ đồng / %
  - Financial Item: The specific financial metric being queried

  Question: {question}
